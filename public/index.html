<!-- viewport-fit=cover lets env(safe-area-inset-*) report real values, which
     is what keeps the sticky modal footer and the toast rail clear of the home
     indicator on a notched phone. Without it those insets are always 0. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#F2EADB" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#130B2B" media="(prefers-color-scheme: dark)"/>

<!-- Loaded last: every rule is inside a media query, so it only ever adds a
     narrow screen's behaviour on top of the two above. -->

<link rel="stylesheet" href="/theme.css"/>
<!-- The retro redesign (R-122, docs/design/PACE.ds). Loaded after theme.css and
     only redefines it; removing this one line restores the Session-23 look. -->
<link rel="stylesheet" href="/retro.css"/>
<!-- THEME, BEFORE FIRST PAINT. This must stay inline and synchronous, here in
     <head>, above <body>. Deferring it by even one tick paints the page light
     and then snaps it to dark — the flash every themed app gets wrong.
     A stored 'light' / 'dark' is the person's own choice. No stored choice is
     AUTO (D-0072): day or night by the person's clock — light from 05:00 to
     16:59, dark otherwise — resolved HERE to a real attribute, plus a
     data-theme-auto marker so the toggle knows nobody chose it. The same hours
     live in paceClockTheme() in 04-shell-login.js; keep the two in step. -->
<script>
(function(){
  var root=document.documentElement,t=null,hh=new Date().getHours();
  // The sky in the top bar (R-122): dawn 05-07, day 08-16, dusk 17-19, night
  // 20-04 — same hours as paceSkyPhase() in 04-shell-login.js.
  root.setAttribute('data-sky',hh>=5&&hh<8?'dawn':hh>=8&&hh<17?'day':hh>=17&&hh<20?'dusk':'night');
  try{ t=localStorage.getItem('pace-theme'); }catch(e){/* private mode: Auto */}
  if(t==='dark'||t==='light'){ root.setAttribute('data-theme',t); return; }
  var h=new Date().getHours();
  root.setAttribute('data-theme',(h>=5&&h<17)?'light':'dark');
  root.setAttribute('data-theme-auto','');
})();
</script>
